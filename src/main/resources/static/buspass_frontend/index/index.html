<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Bus Pass | Login</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <div class="brand-section">

                <div class="logo">SB</div>

                <h1>Student Bus Pass</h1>

                <p>
                    Apply, manage and track your bus pass
                    applications easily.
                </p>

            </div>


            <div class="login-section">

                <h2>Welcome Back</h2>

                <p class="login-subtitle">
                    Sign in to continue
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="role">
                            Login As
                        </label>

                        <select id="role" required>

                            <option value="">
                                Select role
                            </option>

                            <option value="student">
                                Student
                            </option>

                            <option value="admin">
                                Admin
                            </option>

                        </select>

                    </div>


                    <button type="submit">
                        Login
                    </button>


                    <p id="loginMessage"></p>


                    <p class="register-text">
                        Don't have an account?
                        <a href="../register/register.html">
                            Register
                        </a>
                    </p>

                </form>

            </div>

        </section>

    </main>


    <script src="index.js"></script>

</body>
</html>
